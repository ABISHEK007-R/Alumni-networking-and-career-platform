# H2 file database. Data persists under backend/data between restarts.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/alumni_connect;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8081}

# Use a long, random value in production. Keep it outside source control.
alumni.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
alumni.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
alumni.frontend-url=${FRONTEND_URL:http://localhost:5173}
